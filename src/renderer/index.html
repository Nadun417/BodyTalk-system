<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Locks the page down to its own files, so nothing can load from or send to the
         internet. ws: is only here so the dev server can refresh the page while coding. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodyTalk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
